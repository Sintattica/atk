services:

  php-fpm-atk:
    container_name: php-fpm-atk
    image: registry.gitlab.com/sintattica-sinlog/docker/php-fpm:v5
    volumes:
      - ~/.gitconfig:/root/.gitconfig
      - .:/app
    working_dir: /app
    restart: no
    networks:
      - sinlog-net

networks:
  sinlog-net:
    external: true